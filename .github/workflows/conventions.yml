name: conventions

# Mechanisches Gate für die Repo-Konventionen (SPEC-repo-conventions §7):
#  - tests/run-all.sh muss grün sein (Struktur + Plugin-Suiten)
#  - Spec-Touch: ein PR mit Produkt-Änderungen muss specs/docs/journal berühren
#    (oder eine Commit-Message mit [skip-conventions: <grund>] tragen).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # voller Verlauf für den Diff gegen die Base
      - name: run-all (Struktur + Suiten)
        run: bash tests/run-all.sh
      - name: Spec-Touch-Gate
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          # actions/checkout holt mit fetch-depth: 0 bereits die volle Historie;
          # dieser fetch stellt nur sicher, dass origin/<base> als Ref existiert.
          # "--depth=0" war ungültig ("fatal: depth 0 is not a positive number") und
          # das "|| true" schluckte den Abbruch — der Check lief danach gegen eine
          # womöglich unvollständige Historie weiter und konnte grün melden, ohne
          # den echten Diff gesehen zu haben. Fail-closed statt still weiter.
          git fetch origin "${{ github.base_ref }}"
          if ! git rev-parse --verify "origin/${{ github.base_ref }}" >/dev/null 2>&1; then
            echo "::error::origin/${{ github.base_ref }} ist nicht auflösbar — der Diff wäre unvollständig, Abbruch statt Falschmeldung"
            exit 1
          fi
          bash tests/spec-touch-check.sh
