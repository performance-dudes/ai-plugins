name: validate plugins

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Static checks (no Claude CLI required)
        run: |
          set -e
          echo "== marketplace.json parses =="
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null && echo "  ok marketplace.json"

          echo "== every plugin.json parses =="
          for f in plugins/*/.claude-plugin/plugin.json; do
            python3 -m json.tool "$f" >/dev/null && echo "  ok $f"
          done

          echo "== marketplace sources resolve + Versionen konsistent =="
          # Bewusst DERSELBE Helper, den tests/structure/check.sh und die
          # Plugin-Suiten aufrufen. Vorher stand hier eine eigene Kopie dieser
          # Prüfung — die lokale Suite hatte sie gar nicht, also konnte lokal grün
          # und CI rot auseinanderlaufen (passiert am 2026-07-06, drei Wochen
          # unentdeckt). Eine Implementierung, drei Aufrufer.
          bash tests/lib/check-version-sync.sh

          echo "== per-plugin smoke tests =="
          for t in plugins/*/tests/validate.sh; do
            [ -f "$t" ] || continue
            echo "  -> $t"
            bash "$t"
          done
