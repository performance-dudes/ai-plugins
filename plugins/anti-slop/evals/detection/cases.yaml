# LOCKED ground truth for the anti-slop DETECTOR (SPEC-anti-slop US-slop-3).
#
# Regime: STRUCTURED -> deterministic matching, no LLM judge. The observable
# output is a number (hard hits per 1000 words), so a judge would only add
# variance to something already objective.
#
# TEST THE REAL OBJECT: score_detection.py runs the shipping
# skills/anti-slop/scripts/check-slop.py against the shipping lists. No copy of
# the term lists lives in this file.
#
# THE CASES ARE FROZEN. A failure is a plugin bug — fix the lists, the overrides
# or the script. Never loosen a threshold to make a run green.
#
# origin: human    -> written by a person, prose that must stay quiet
# origin: generated -> LLM output of the kind this plugin exists to catch
#
# Thresholds come from SPEC-anti-slop:
#   human     -> at most  1.0 hard hits / 1000 words
#   generated -> at least 50.0 hard hits / 1000 words
# The gap between the bounds is the plugin's promise; a case that lands between
# them is a real finding, not a tolerance to widen.

- name: h01-technical-de
  origin: human
  lang: de
  note: |
    Knappe deutsche Fachprosa mit Zahlen statt Adjektiven. Enthält bewusst
    'Import', 'Zeitzone', 'Analyse' — Fachwörter, die in der Nähe von
    Listeneinträgen liegen, aber keine Floskeln sind.
  text: |
    Wir haben 340 Zeilen geprüft und drei Fehler gefunden. Zwei lagen im Import,
    einer in der Zeitzone. Der Import läuft seit Dienstag wieder, die Zeitzone
    steht auf Europe/Berlin. Kosten: elf Tage, davon vier für die Analyse.
    Der Rest ging für das Nachziehen der Testdaten drauf, weil die alten
    Fixtures noch auf dem Schema von 2024 standen.

- name: h02-technical-en
  origin: human
  lang: en
  note: |
    English technical prose that deliberately uses vocabulary colliding with the
    lists — 'key', 'transform', 'harness', 'dynamic', 'manifest'. These are the
    exact words severity-overrides.json demotes; if the overrides regress, this
    case goes red first.
  text: |
    The test harness reads the plugin manifest and transforms each entry into a
    key-value pair. Dynamic imports are resolved at load time, so a missing file
    surfaces as a load error rather than a silent skip. We measured 340 runs:
    two failed, both on a stale fixture. The fix took an afternoon.

