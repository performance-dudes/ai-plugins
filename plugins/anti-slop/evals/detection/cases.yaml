- name: h04-long-de
  origin: human
  lang: de
  note: |
    Langer Fall (268 Wörter) mit dichter Fachsprache — der Case, an dem ein
    Fehlalarm am wahrscheinlichsten wäre. Ehrlich dazu: auch bei 268 Wörtern
    toleriert "höchstens 1,0 je 1000" rechnerisch NULL Treffer (ein einzelner
    ergäbe 3,7). Die Schwelle wird erst ab rund 1000 Wörtern zu einer eigenen
    Aussage; ein Case dieser Länge in einer YAML wäre unlesbar. Gemessen wurde
    sie stattdessen am echten Korpus: 17.500 Wörter Repo-Dokumentation liegen bei
    0,5 je 1000. Dieser Case prüft also Dichte und Länge, nicht die Grenze.
  text: |
    Der Aggregator sucht alle Suiten selbst zusammen. Jede Datei, die dem Muster
    tests/<plugin>/run.sh entspricht, wird eingehängt, alphabetisch, und ihr
    Rückgabewert eingesammelt. Läuft eine Suite rot, ist der Gesamtlauf rot. Das
    hat einen praktischen Grund: Wer ein Plugin migriert, muss den Aggregator
    nicht anfassen, und zwei parallele Plugin-Zweige kollidieren nicht auf
    derselben Datei.

    Die Struktur-Prüfung läuft immer zuerst. Sie vergleicht die Versionen an
    beiden Orten, an denen sie stehen: in der plugin.json des Plugins und im
    Marketplace-Manifest. Laufen die auseinander, zieht ein Nutzer beim Update
    etwas anderes, als hier getestet wurde. Am 6. Juli 2026 blieb genau das acht
    Läufe lang unbemerkt, weil die Prüfung nur in der Pipeline lag und nicht in
    der lokalen Suite. Seitdem liegt sie in tests/lib und wird von beiden Seiten
    aufgerufen.

    Die Suiten selbst laufen ohne Netz und ohne Pakete. Vorausgesetzt werden bash
    und python3, sonst nichts. Wer eine Abhängigkeit braucht, legt sie in die
    Eval, nicht in die Suite — Evals dürfen mehr voraussetzen, weil sie seltener
    laufen und nicht in der Pipeline hängen.

    Für neue Plugins gilt die Reihenfolge aus der Konventions-Spec: erst die
    Spezifikation und der Pull Request, dann die Tests für die neuen Kriterien,
    dann der Plan, dann die Umsetzung. Der Plan wird am Ende gelöscht, der
    Journal-Eintrag bleibt. Ein Pull Request, der Code ohne Spezifikation
    mitbringt, wird von der Pipeline zurückgewiesen, sofern kein Marker das
    begründet.

    Was hier nicht geprüft wird, steht in der jeweiligen README des
    Test-Verzeichnisses. Die Trennung ist bewusst: Die Suite beantwortet, ob
    etwas korrekt verdrahtet ist, die Eval beantwortet, ob es das Richtige tut.

