    that was enough.

- name: h05-literary-en
  origin: human
  lang: en
  note: |
    Jane Austen, Pride and Prejudice (1813) — written 210 years before any LLM,
    so every hard hit here is by construction a false positive. Carries
    'charming' and 'engrossed', two register markers the lists flag. Goes red if
    a register marker is ever promoted back to hard.
  text: |
    Mr. Darcy stood near them in silent indignation at such a mode of passing the
    evening, to the exclusion of all conversation, and was too much engrossed by
    his own thoughts to perceive that Sir William Lucas was his neighbour, till
    Sir William thus began:-- "What a charming amusement for young people this
    is, Mr. Darcy! There is nothing like dancing, after all. I consider it as one
    of the first refinements of polished societies."

